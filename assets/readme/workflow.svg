<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">read-xhs-notes：匿名优先的阅读流程</title>
  <desc id="desc">公开链接直接匿名解析；收藏或喜欢列表先通过已授权会话取得卡片，再进入同一条内容识别和阅读记录流程。</desc>
  <rect width="1200" height="520" rx="28" fill="#F6F8FB"/>
  <g font-family="Arial, sans-serif">
    <text x="56" y="62" fill="#0B1220" font-size="34" font-weight="800">两种入口，一条证据链</text>
    <text x="56" y="94" fill="#5A6B80" font-size="17">公开笔记不依赖登录；私有列表只用授权会话枚举，不把凭据交给解析器。</text>

    <g transform="translate(56 130)">
      <rect width="500" height="116" rx="18" fill="#0B1220"/>
      <text x="24" y="30" fill="#6EE7D2" font-size="14" font-weight="800">入口 A · 公开单篇链接</text>
      <rect x="24" y="49" width="245" height="38" rx="10" fill="#17283D"/>
      <text x="38" y="73" fill="#F6F8FB" font-size="14" font-family="Courier, monospace">xhslink.cn/o/…</text>
      <path d="M291 68H326" stroke="#6EE7D2" stroke-width="3"/>
      <path d="M318 61L329 68L318 75" fill="none" stroke="#6EE7D2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="348" y="64" fill="#F6F8FB" font-size="16" font-weight="700">匿名解析</text>
      <text x="348" y="85" fill="#9DB0C8" font-size="13" font-family="Courier, monospace">credentials: omit</text>
    </g>

    <g transform="translate(644 130)">
      <rect width="500" height="116" rx="18" fill="#FFFFFF" stroke="#D5DEE9"/>
      <text x="24" y="30" fill="#3152D9" font-size="14" font-weight="800">入口 B · 收藏 / 喜欢列表</text>
      <rect x="24" y="49" width="164" height="38" rx="10" fill="#E8EEFF"/>
      <text x="41" y="73" fill="#233CBA" font-size="14" font-weight="700">已授权会话</text>
      <path d="M210 68H245" stroke="#3152D9" stroke-width="3"/>
      <path d="M237 61L248 68L237 75" fill="none" stroke="#3152D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="267" y="64" fill="#0B1220" font-size="16" font-weight="700">取得卡片 / 笔记 ID</text>
      <text x="267" y="85" fill="#5A6B80" font-size="13">只枚举用户明确授权的范围</text>
    </g>

    <path d="M306 246V276H600V304" fill="none" stroke="#AAB9C9" stroke-width="3" stroke-linecap="round"/>
    <path d="M894 246V276H600V304" fill="none" stroke="#AAB9C9" stroke-width="3" stroke-linecap="round"/>
    <path d="M593 296L600 307L607 296" fill="none" stroke="#AAB9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(56 304)">
      <rect width="250" height="128" rx="18" fill="#FFFFFF" stroke="#D5DEE9"/>
      <text x="22" y="34" fill="#3152D9" font-size="14" font-weight="800">01 · 内容盘点</text>
      <text x="22" y="67" fill="#0B1220" font-size="19" font-weight="800">正文 / 图片 / 视频</text>
      <text x="22" y="94" fill="#5A6B80" font-size="14">按实际展示顺序保留。</text>
    </g>
    <g transform="translate(328 304)">
      <rect width="250" height="128" rx="18" fill="#FFFFFF" stroke="#D5DEE9"/>
      <text x="22" y="34" fill="#3152D9" font-size="14" font-weight="800">02 · 内容识别</text>
      <text x="22" y="67" fill="#0B1220" font-size="19" font-weight="800">OCR / 字幕 / 关键帧</text>
      <text x="22" y="94" fill="#5A6B80" font-size="14">证据和不确定项分开。</text>
    </g>
    <g transform="translate(600 304)">
      <rect width="250" height="128" rx="18" fill="#0B1220"/>
      <text x="22" y="34" fill="#6EE7D2" font-size="14" font-weight="800">03 · 阅读记录</text>
      <text x="22" y="67" fill="#F6F8FB" font-size="19" font-weight="800">轻度 / 中度 / 高度</text>
      <text x="22" y="94" fill="#9DB0C8" font-size="14">保留原链接，方便回看。</text>
    </g>
    <g transform="translate(872 304)">
      <rect width="272" height="128" rx="18" fill="#DDF8F2" stroke="#B8E9DE"/>
      <text x="22" y="34" fill="#087D6F" font-size="14" font-weight="800">失败也有边界</text>
      <text x="22" y="67" fill="#0B1220" font-size="18" font-weight="800">不绕验证 · 不回退 Cookie</text>
      <text x="22" y="94" fill="#38665F" font-size="14">明确报告缺口和原因。</text>
    </g>
  </g>
  <text x="56" y="478" fill="#5A6B80" font-size="15" font-family="Courier, monospace">source-grounded · local-first · read what was actually available</text>
</svg>
