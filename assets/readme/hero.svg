<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">read-xhs-notes：快速读取小红书笔记，匿名优先</title>
  <desc id="desc">把公开小红书链接解析成正文、图片文字、视频证据和可回看的阅读记录。</desc>
  <rect width="1200" height="400" rx="28" fill="#0B1220"/>
  <path d="M54 326H1146" stroke="#24344A" stroke-width="1"/>
  <path d="M54 70H610" stroke="#6EE7D2" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
    <text x="54" y="112" fill="#9DB0C8" font-size="17" font-weight="700" letter-spacing="2">小红书笔记阅读工具 · ANONYMOUS FIRST</text>
    <text x="54" y="180" fill="#F6F8FB" font-size="52" font-weight="800">read-xhs-notes</text>
    <text x="54" y="224" fill="#D9E4F0" font-size="25" font-weight="600">把一条链接，变成可核对的阅读记录</text>
    <text x="54" y="263" fill="#9DB0C8" font-size="18">正文、图片文字、视频证据；轻度整理，不替原文添内容。</text>
    <text x="54" y="365" fill="#6EE7D2" font-size="15" font-family="Courier, monospace">credentials: omit   ·   public link   ·   source-grounded</text>
  </g>
  <g transform="translate(692 48)">
    <rect width="454" height="250" rx="22" fill="#121E30" stroke="#2D4764"/>
    <g transform="translate(24 24)" font-family="Courier, monospace">
      <rect width="406" height="34" rx="9" fill="#1D3047"/>
      <circle cx="18" cy="17" r="5" fill="#6EE7D2"/>
      <text x="34" y="22" fill="#D9E4F0" font-size="13">xhslink.cn/o/…</text>
      <text x="0" y="72" fill="#6EE7D2" font-size="13">01  FETCH  PUBLIC PAGE</text>
      <text x="0" y="99" fill="#9DB0C8" font-size="13">credentials: omit</text>
      <text x="0" y="126" fill="#9DB0C8" font-size="13">cookie:         [not read]</text>
      <text x="0" y="153" fill="#6EE7D2" font-size="13">02  EXTRACT  NOTE STATE</text>
      <rect x="0" y="170" width="406" height="54" rx="10" fill="#182A40"/>
      <text x="16" y="193" fill="#F6F8FB" font-size="14">[正文]   [图 01–09]   [视频]</text>
      <text x="16" y="214" fill="#FFBE7A" font-size="12">evidence stays separate from summary</text>
    </g>
  </g>
  <g transform="translate(700 335)" font-family="Courier, monospace" font-size="14">
    <rect width="102" height="30" rx="15" fill="#173C3A"/>
    <text x="18" y="20" fill="#6EE7D2">正文</text>
    <rect x="114" width="122" height="30" rx="15" fill="#3B2E20"/>
    <text x="132" y="20" fill="#FFBE7A">图片 OCR</text>
    <rect x="248" width="122" height="30" rx="15" fill="#25334A"/>
    <text x="266" y="20" fill="#B5C8E0">视频证据</text>
  </g>
</svg>
